<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="STARBOUND — GamerKie Edition. Explore endless procedural worlds, swing through dangerous ruins, solve physics puzzles and survive the unknown.">
  <title>STARBOUND — GamerKie Edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><span>STAR<span class="orange">BOUND</span></span><small>GAMERKIE</small></div>
    <div class="level-label"><span>LEVEL</span><b id="levelNo">01</b></div>
    <button id="pauseBtn" class="icon-btn" aria-label="Pause game" title="Pause">Ⅱ</button>
  </header>

  <section class="hud" aria-live="polite">
    <div class="mission-block"><small id="worldName">UNKNOWN WORLD</small><strong id="mission">Reach the portal</strong><span id="weatherLabel">CLEAR · DAY</span></div>
    <div class="stats"><span>✦ <b id="shards">0</b></span><span>♥ <b id="health">3</b></span><span class="difficulty" id="difficulty">HARD</span></div>
  </section>

  <main id="stage-wrap">
    <canvas id="game" aria-label="Starbound game world"></canvas>
    <div id="overlay" class="overlay">
      <div class="panel">
        <div class="eyebrow">GAMERKIE ORIGINAL</div>
        <h1>STAR<span>BOUND</span></h1>
        <p>ONE HERO. INFINITE WORLDS.<br>NO TWO JOURNEYS ALIKE.</p>
        <div class="menu-buttons">
          <button id="startBtn" class="primary">NEW JOURNEY</button>
          <button id="continueBtn" class="secondary">CONTINUE</button>
        </div>
        <div class="menu-links">
          <button id="worldMapBtn">WORLD MAP</button>
          <button id="settingsBtn">SETTINGS</button>
          <button id="howBtn">HOW TO PLAY</button>
        </div>
        <div class="hint">MOVE · JUMP · GRAPPLE · SURVIVE</div>
      </div>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </main>

  <nav class="controls" aria-label="Game controls">
    <div class="move-controls">
      <button data-key="left" aria-label="Move left">◀</button>
      <button data-key="right" aria-label="Move right">▶</button>
    </div>
    <div class="action-controls">
      <button data-key="interact" class="interact" aria-label="Grapple or interact">GRAPPLE</button>
      <button data-key="jump" class="jump" aria-label="Jump">JUMP</button>
    </div>
  </nav>
  <footer><span>A / D OR ◀ ▶ · SPACE TO JUMP · E TO GRAPPLE / INTERACT</span><span>GAMERKIE © 2026</span></footer>
</div>
<script src="js/level-core.js"></script>
<script src="js/game.js"></script>
</body>
</html>
